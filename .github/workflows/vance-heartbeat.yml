name: Vance Autonomous Heartbeat

on:
  schedule:
    - cron: '0 20 * * *' # Runs daily at 5:00 AM JST (20:00 UTC) right around your morning routine
  workflow_dispatch: # Lets you trigger Vance manually with 1 click anytime

permissions:
  contents: write

jobs:
  vance-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vance-Core Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Vance Autonomous Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node vance-agent.mjs

      - name: Commit Updated State & New Web Assets
        run: |
          git config user.name "Vance-Core (Autonomous Agent)"
          git config user.email "vance@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Vance Autonomous Cycle: Telemetry + Asset Build"
          git push
