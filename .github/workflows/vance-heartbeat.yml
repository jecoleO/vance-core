name: Vance Autonomous Heartbeat

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'generate'
        type: choice
        options:
          - generate
          - delete
      target_slug:
        description: 'Slug to delete (only used if action is delete)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  vance-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vance-Core Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Vance Autonomous Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ACTION: ${{ inputs.action }}
          TARGET_SLUG: ${{ inputs.target_slug }}
        run: node vance-agent.mjs

      - name: Commit Updated State & Assets
        run: |
          git config user.name "Vance-Core (Autonomous Agent)"
          git config user.email "vance@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Vance Cycle: ${{ inputs.action || 'generate' }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No state changes or assets to commit."
          fi
