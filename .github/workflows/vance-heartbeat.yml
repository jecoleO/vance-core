name: Vance Autonomous Heartbeat

on:
  schedule:
    # 20:17 UTC = 5:17 AM JST daily
    # Using an odd minute (:17) bypasses the top-of-the-hour queue crush
    - cron: '17 20 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime

permissions:
  contents: write

jobs:
  vance-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vance-Core Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Vance Autonomous Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node vance-agent.mjs

      - name: Commit Updated State & New Web Assets
        run: |
          git config user.name "Vance-Core (Autonomous Agent)"
          git config user.email "vance@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Vance Autonomous Cycle: Telemetry + Daily Dossier [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            console.log("No state changes or new assets to commit.")
          fi
          git add .
          git diff --staged --quiet || git commit -m "Vance Autonomous Cycle: Telemetry + Asset Build"
          git push
