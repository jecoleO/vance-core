name: Vance Autonomous Heartbeat

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Operational Action'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - audit
          - delete
          - synthesize_news
          - daily_heartbeat
      target_slug:
        description: 'Target slug for operations (if applicable)'
        required: false
        default: ''
      target_level:
        description: 'Target JLPT level for synthesis'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - N5
          - N4
          - N3
          - N2
          - N1

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'vance-core-deploy'
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Vance Operations
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ inputs.action || 'daily_heartbeat' }}
          TARGET_SLUG: ${{ inputs.target_slug || '' }}
          TARGET_LEVEL: ${{ inputs.target_level || 'auto' }}
        run: node vance-agent.mjs

      - name: Commit and Push State Updates
        if: env.ACTION != 'audit'
        run: |
          git config --global user.name "Vance Autonomous Studio"
          git config --global user.email "vance-agent@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No state or catalog changes to commit."
          else
            git commit -m "chore(vance-ops): catalog sync & state refresh [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
