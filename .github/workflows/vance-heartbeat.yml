name: Vance Autonomous Heartbeat

on:
  schedule:
    # 7:00 AM JST daily autonomous publication (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Operational Action'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - synthesize_news
          - daily_heartbeat
          - delete
      target_level:
        description: 'JLPT Target Level (Only used if synthesize_news)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - N5
          - N4
          - N3
          - N2
          - N1
      target_slug:
        description: 'Target slug (Only used if delete)'
        required: false
        default: ''

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Vance Agent
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACTION: ${{ inputs.action || 'daily_heartbeat' }}
          TARGET_LEVEL: ${{ inputs.target_level || 'auto' }}
          TARGET_SLUG: ${{ inputs.target_slug || '' }}
        run: node vance-agent.mjs

      - name: Commit Updated State & Assets
        run: |
          git config user.name "Vance-Core (Autonomous Agent)"
          git config user.email "vance-agent@the-creativity-experiment.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Vance Cycle: ${{ inputs.action || 'heartbeat' }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No state changes or assets to commit."
          fi
